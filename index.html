<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마케터로 살아남기 MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="startScreen" class="start-screen" aria-label="게임 시작">
      <div class="start-copy">
        <div class="brand-mark start-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p class="start-kicker">인턴 마케터 12라운드 평가</p>
        <h1>마케터로 살아남기</h1>
        <p>첫 출근 날, 작은 테스트 예산과 애매한 지시가 동시에 떨어졌습니다. 12번의 선택으로 EXP를 쌓고 예산을 회수하세요.</p>
        <button id="startButton" class="primary-button start-button" type="button">게임 시작</button>
      </div>
    </section>

    <main class="app">
      <section class="topbar" aria-label="게임 상태">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <h1>마케터로 살아남기</h1>
            <p>인턴 12라운드 평가</p>
          </div>
        </div>
        <div class="round-pill">
          <span id="roundLabel">Round 1</span>
          <strong id="phaseLabel">인턴 생존 중</strong>
        </div>
        <button class="menu-button" type="button" aria-label="메뉴">☰</button>
      </section>

      <section class="resource-grid" aria-label="핵심 자원">
        <article class="meter-card money-card">
          <div class="meter-head"><span>예산</span><strong id="moneyValue">100000</strong></div>
          <div class="meter"><span id="moneyBar"></span></div>
        </article>
        <article class="meter-card hp-card">
          <div class="meter-head"><span>멘탈</span><strong id="mentalValue">10</strong></div>
          <div class="meter"><span id="mentalBar"></span></div>
        </article>
        <article class="meter-card score-card">
          <div class="meter-head"><span>EXP</span><strong id="performanceValue">0</strong></div>
          <div class="meter"><span id="performanceBar"></span></div>
        </article>
        <article class="meter-card trust-card">
          <div class="meter-head"><span>신뢰</span><strong id="trustValue">5</strong></div>
          <div class="meter"><span id="trustBar"></span></div>
        </article>
      </section>

      <section class="play-layout">
        <section class="main-stage" aria-live="polite">
          <div class="situation-card">
            <div class="situation-meta">
              <span id="situationCategory">상황</span>
              <span id="situationRisk">위험</span>
            </div>
            <h2 id="situationName">시작 대기</h2>
            <p id="situationText">인턴 마케터의 첫 캠페인이 시작됩니다.</p>
          </div>

          <section class="advisor-panel" aria-label="선택 카드 설명">
            <div class="advisor-bubble">
              <p id="advisorText">카드를 하나 골라보면 제가 실행 방향을 정리해볼게요.</p>
            </div>
            <div class="advisor-character" aria-hidden="true">
              <div class="advisor-face">
                <span></span>
                <span></span>
              </div>
              <strong id="advisorName">인턴 지우</strong>
            </div>
          </section>

          <div class="cards-head">
            <div>
              <h2 id="stageHeading">선택 카드</h2>
              <p id="stageSubcopy">이번 턴에 사용할 카드를 선택하세요.</p>
            </div>
            <button id="restartButton" class="icon-button" type="button" title="새 게임">↻</button>
          </div>
          <div id="cardChoices" class="card-grid"></div>
          <button id="confirmChoiceButton" class="primary-button confirm-button" type="button">결정</button>

          <div id="turnResult" class="turn-result hidden">
            <div class="result-copy">
              <span id="turnResultBadge">선택 결과</span>
              <h2 id="turnResultTitle">결과</h2>
              <div id="turnResultText" class="turn-result-text"></div>
              <div id="turnResultDelta" class="turn-delta"></div>
            </div>
            <button id="continueButton" class="primary-button" type="button">다음 턴</button>
          </div>
        </section>

      </section>
    </main>

    <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="modal-body">
        <p id="resultBadge" class="result-badge">평가</p>
        <h2 id="resultTitle">결과</h2>
        <p id="resultSummary"></p>
        <div id="resultStats" class="result-stats"></div>
        <button id="modalRestartButton" class="primary-button" type="button">다시 시작</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
